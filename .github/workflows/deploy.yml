name: Deploy to Lightsail

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t velox-backend:${{ github.sha }} ./backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Lightsail CLI plugin
        run: |
          curl "https://s3.us-west-2.amazonaws.com/lightsail.amazonaws.com/lightsailctl-linux-amd64" -o /usr/local/bin/lightsailctl
          chmod +x /usr/local/bin/lightsailctl

      - name: Push backend image to Lightsail
        run: |
          aws lightsail push-container-image \
            --service-name velox-backend \
            --label velox-backend \
            --image velox-backend:${{ github.sha }}

      - name: Get pushed backend image reference
        id: backend_image
        run: |
          IMAGE_REF=$(aws lightsail get-container-images \
            --service-name velox-backend \
            --query "containerImages[0].image" --output text)
          echo "image=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Deploy backend
        run: |
          aws lightsail create-container-service-deployment \
            --service-name velox-backend \
            --containers "{
              \"velox-backend\": {
                \"image\": \"${{ steps.backend_image.outputs.image }}\",
                \"ports\": { \"5002\": \"HTTP\" },
                \"environment\": {
                  \"DB_HOST\": \"${{ secrets.DB_HOST }}\",
                  \"DB_PORT\": \"5432\",
                  \"DB_USER\": \"${{ secrets.DB_USER }}\",
                  \"DB_PASSWORD\": \"${{ secrets.DB_PASSWORD }}\",
                  \"DB_NAME\": \"${{ secrets.DB_NAME }}\",
                  \"NODE_ENV\": \"production\",
                  \"ALLOWED_ORIGINS\": \"${{ secrets.FRONTEND_URL }}\",
                  \"JWT_SECRET\": \"${{ secrets.JWT_SECRET }}\",
                  \"JWT_EXPIRES_IN\": \"7d\"
                }
              }
            }" \
            --public-endpoint "{
              \"containerName\": \"velox-backend\",
              \"containerPort\": 5002,
              \"healthCheck\": { \"path\": \"/health\" }
            }"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build -t velox-frontend:${{ github.sha }} \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            ./frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Lightsail CLI plugin
        run: |
          curl "https://s3.us-west-2.amazonaws.com/lightsail.amazonaws.com/lightsailctl-linux-amd64" -o /usr/local/bin/lightsailctl
          chmod +x /usr/local/bin/lightsailctl

      - name: Push frontend image to Lightsail
        run: |
          aws lightsail push-container-image \
            --service-name velox-frontend \
            --label velox-frontend \
            --image velox-frontend:${{ github.sha }}

      - name: Get pushed frontend image reference
        id: frontend_image
        run: |
          IMAGE_REF=$(aws lightsail get-container-images \
            --service-name velox-frontend \
            --query "containerImages[0].image" --output text)
          echo "image=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        run: |
          aws lightsail create-container-service-deployment \
            --service-name velox-frontend \
            --containers "{
              \"velox-frontend\": {
                \"image\": \"${{ steps.frontend_image.outputs.image }}\",
                \"ports\": { \"80\": \"HTTP\" }
              }
            }" \
            --public-endpoint "{
              \"containerName\": \"velox-frontend\",
              \"containerPort\": 80,
              \"healthCheck\": { \"path\": \"/\" }
            }"