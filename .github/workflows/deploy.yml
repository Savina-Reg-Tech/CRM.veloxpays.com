name: Deploy CRM Backend

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: backend/node-crm
        run: npm ci

      - name: Run tests
        working-directory: backend/node-crm
        run: npm test

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to CRM ASG
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ secrets.ASG_NAME }} \
            --query 'AutoScalingGroups[0].Instances[*].InstanceId' \
            --output text)

          echo "Deploying to: $INSTANCE_IDS"

          for INSTANCE_ID in $INSTANCE_IDS; do
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["cd /app/crm","git pull origin main","docker compose up -d --build","docker image prune -f"]' \
              --comment "Deploy CRM from GitHub Actions"
          done

      - name: Deployment complete
        run: echo "✅ CRM deployed successfully"
