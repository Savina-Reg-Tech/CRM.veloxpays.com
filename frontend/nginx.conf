# Security headers.
#
# nginx only inherits add_header from the server level into a location that has NO add_header of
# its own, so every location below that sets a header repeats the full set via these variables.
#
#  - CSP: scripts only from this origin (the Vite bundle); inline styles are needed for the
#    themed forms and charts; images may come from https hosts (VeloxVerse vehicle photos,
#    avatars, QR codes) and data:/blob: URLs; API calls go to the CRM API over https (and
#    localhost for a local stack).
#  - The admin app can't be framed by another site (clickjacking). /embed/ is the one exception:
#    public forms are meant to be embedded on other websites.

map $uri $csp_base {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; font-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Public embeddable forms ─────────────────────────────────────────────
    # Served from this location (no internal redirect), so these headers — not the
    # /index.html ones — apply: any site may frame a form.
    location /embed/ {
        add_header Content-Security-Policy "$csp_base; frame-ancestors *" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # ── Hashed build assets (JS/CSS/images emitted by Vite) ─────────────────
    # Content-hashed file names, so they can be cached forever. Only /assets/ — the files in
    # the site root (favicon, logo, login background) keep their names between releases and
    # must not be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── The app shell ───────────────────────────────────────────────────────
    # Never cached, never framed by another site.
    location = /index.html {
        add_header Content-Security-Policy "$csp_base; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback — every unknown path serves index.html (through the location above)
    # so React Router handles the route on the client side. Real files in the site root
    # (favicon, logo…) are served from here with a short cache.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ /index.html;
    }
}
